services:
  - type: web
    name: kelana-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: kelana-db
          property: connectionString
    healthCheckPath: /health
